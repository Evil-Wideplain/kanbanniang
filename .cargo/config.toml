# 构建产物统一放到仓库根 target/（相对本文件所在目录解析，与 cargo 调用的 cwd 无关）
[build]
target-dir = "target"

# Windows GNU 工作区 workaround：rust 内置 rust-lld 存在链接 bug（导入描述符丢失，
# 导致部分 exe 运行时 DEP 崩溃），改用 MSYS2 clang+lld 链接，并注入匹配的 mingw CRT。
# 仅对 x86_64-pc-windows-gnu 目标生效；安装 MSVC 后使用 msvc 目标时此配置自动忽略。
[target.x86_64-pc-windows-gnu]
linker = "C:/Users/XieQi/.cargo/bin/link_wrap.exe"
rustflags = ["-LC:/Users/XieQi/.rustup/toolchains/stable-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/lib/self-contained"]
